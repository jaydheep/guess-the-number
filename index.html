<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guess the Number</title>
<meta name="description" content="Find the secret number between 1 and 10. Follow the higher and lower hints.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div id="fx" aria-hidden="true"></div>
  <header>
    <h1>Guess the number</h1>
    <p class="how">I picked a secret number from <b>1 to 10</b>. Tap a number to guess. I will tell you to go <b>higher</b> or <b>lower</b> until you find it.</p>
  </header>
  <p class="range">The secret number is between <b id="lo">1</b> and <b id="hi">10</b></p>
  <section id="board" aria-label="Numbers 1 to 10"></section>
  <div id="fb" class="fb" role="status" aria-live="polite">
    <span id="arrow" class="arrow">?</span>
    <div><strong id="fbT">Your move</strong><p id="fbS">Pick any number from 1 to 10.</p></div>
  </div>
  <div class="hist"><span>Your guesses</span><ul id="hist"></ul></div>
  <footer>
    <span>Tries <b id="tries">0</b></span>
    <span>Best <b id="best">-</b></span>
    <button id="reset" type="button">New game</button>
  </footer>
  <small>Created by Jaydheep</small>
</main>
<script src="script.js"></script>
</body>
</html>
